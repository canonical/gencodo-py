# Publishes gencodo-py whenever a vX.Y.Z tag is pushed (see `make release`):
# checks that the tag matches __version__ and that CHANGELOG.md has a section
# for it, builds, uploads to PyPI via trusted publishing (environment "pypi",
# bound to this workflow file name), and creates the GitHub release with the
# CHANGELOG section as notes and the distributions attached.

name: Publish to PyPI

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          # No cache: a release must build from pristine dependencies
          enable-cache: false

      - name: Check version and extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -qE "^__version__ = \"$version\"$" src/gencodo/__init__.py; then
            echo "src/gencodo/__init__.py __version__ does not match tag $TAG"
            exit 1
          fi
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section; add one before tagging."
            exit 1
          fi
          echo "Release notes:"
          cat release-notes.md

      - name: Test
        run: |
          uv sync --group dev --locked
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            release-notes.md

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*
